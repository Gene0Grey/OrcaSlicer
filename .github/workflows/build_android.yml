name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [android-port]
    paths:
      - 'android/**'
      - 'deps/**'
      - 'deps_src/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build_android.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ABI: arm64-v8a
      ANDROID_TOOLS: ${{ github.workspace }}/../android-tools
      ORCA_ANDROID_OUT: ${{ github.workspace }}/../orca-build
      JOBS: 4
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL && df -h /

      - name: Install NDK r29, CMake 4.5, Ninja
        run: |
          mkdir -p "$ANDROID_TOOLS/bin" && cd "$ANDROID_TOOLS"
          curl -sSLo ndk.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q ndk.zip && rm ndk.zip
          curl -sSL https://github.com/Kitware/CMake/releases/download/v4.5.0/cmake-4.5.0-linux-x86_64.tar.gz | tar xz
          curl -sSLo ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip
          unzip -q ninja.zip -d bin && rm ninja.zip

      - name: Restore dependency prefix
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ORCA_ANDROID_OUT }}/prefix-arm64-v8a
          key: android-deps-${{ env.ABI }}-${{ hashFiles('deps/**', 'android/scripts/build_deps.sh') }}

      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bash android/scripts/build_deps.sh "$ABI"

      - name: Build libslic3r + orca-slicer CLI
        run: bash android/scripts/build_core.sh "$ABI" OrcaSlicer

      - name: Package native libs into the app
        run: |
          BIN=$(find "$ORCA_ANDROID_OUT/core-$ABI" -name orca-slicer -type f | head -1)
          NDK="$ANDROID_TOOLS/android-ndk-r29"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          LIBS=android/app/src/main/jniLibs/$ABI
          mkdir -p "$LIBS"
          # Named lib*.so so Android extracts it to the executable native lib dir.
          "$STRIP" -o "$LIBS/liborcaslicer_cli.so" "$BIN"
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$LIBS/"
          ls -la "$LIBS"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        working-directory: android
        run: bash gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: orcaslicer-android-${{ env.ABI }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/src/main/jniLibs/${{ env.ABI }}/*.so
