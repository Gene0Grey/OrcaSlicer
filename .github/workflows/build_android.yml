name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [android-port]
    paths:
      - 'android/**'
      - 'deps/**'
      - 'deps_src/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build_android.yml'

# A newer push supersedes a build still running (keeps Actions usage down on this fork).
concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # Not ABI: GMP's configure reads $ABI.
      ORCA_ABI: arm64-v8a
      ANDROID_TOOLS: ${{ github.workspace }}/../android-tools
      # Inside the repo: some dep patches are applied with repo-relative paths.
      ORCA_ANDROID_OUT: ${{ github.workspace }}/build-android
      # The runner presets ANDROID_NDK to its own NDK; pin the one the scripts expect.
      ANDROID_NDK: ${{ github.workspace }}/../android-tools/android-ndk-r29
      JOBS: 4
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL && df -h /

      - name: Install NDK r29, CMake 4.5, Ninja
        run: |
          mkdir -p "$ANDROID_TOOLS/bin" && cd "$ANDROID_TOOLS"
          curl -sSLo ndk.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q ndk.zip && rm ndk.zip
          curl -sSL https://github.com/Kitware/CMake/releases/download/v4.5.0/cmake-4.5.0-linux-x86_64.tar.gz | tar xz
          curl -sSLo ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip
          unzip -q ninja.zip -d bin && rm ninja.zip

      - name: Restore dependency prefix
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ORCA_ANDROID_OUT }}/prefix-arm64-v8a
          key: android-deps-${{ env.ORCA_ABI }}-${{ hashFiles('deps/**', 'android/scripts/build_deps.sh') }}

      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bash android/scripts/build_deps.sh "$ORCA_ABI"

      # Saved right away so a later failing step doesn't throw the deps away.
      - name: Save dependency prefix
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ORCA_ANDROID_OUT }}/prefix-arm64-v8a
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-core-${{ env.ORCA_ABI }}
          max-size: 2G

      - name: Build libslic3r + liborca_core
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: bash android/scripts/build_core.sh "$ORCA_ABI" orca_core

      - name: List installed package configs
        if: failure()
        run: find "$ORCA_ANDROID_OUT/prefix-$ORCA_ABI" \( -name '*Config.cmake' -o -name '*-config.cmake' \) | sed "s|$ORCA_ANDROID_OUT/||"

      - name: Package native libs into the app
        run: |
          LIB=$(find "$ORCA_ANDROID_OUT/core-$ORCA_ABI" -name liborca_core.so -type f | head -1)
          NDK="$ANDROID_TOOLS/android-ndk-r29"
          LIBS=android/app/src/main/jniLibs/$ORCA_ABI
          mkdir -p "$LIBS"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" -o "$LIBS/liborca_core.so" "$LIB"
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$LIBS/"
          ls -la "$LIBS"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The native libraries are the expensive part: keep them even when the APK step fails.
      - uses: actions/upload-artifact@v4
        with:
          name: liborca-core-${{ env.ORCA_ABI }}
          path: android/app/src/main/jniLibs/${{ env.ORCA_ABI }}/*.so

      # Maven Central downloads fail now and then on the runners: one retry.
      - name: Build APK
        working-directory: android
        run: bash gradlew assembleRelease --console=plain || (sleep 60 && bash gradlew assembleRelease --console=plain --refresh-dependencies)

      - uses: actions/upload-artifact@v4
        with:
          name: orcaslicer-android-${{ env.ORCA_ABI }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/src/main/jniLibs/${{ env.ORCA_ABI }}/*.so
